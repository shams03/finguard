services:
  postgres:
    image: postgres:18-alpine
    container_name: finguard-postgres
    environment:
      POSTGRES_USER: finguard
      POSTGRES_PASSWORD: finguard
      POSTGRES_DB: finguard
    ports:
      - "5432:5432"
    volumes:
      # PG 18 images keep a versioned PGDATA under /var/lib/postgresql
      - finguard_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finguard -d finguard"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  finguard_pg:
